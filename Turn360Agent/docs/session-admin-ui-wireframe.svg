<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <defs>
    <style>
      .bg { fill: #eef1f5; }
      .panel { fill: #ffffff; stroke: #cfd7e3; stroke-width: 1.2; }
      .soft { fill: #f8fafc; stroke: #d9e1ec; stroke-width: 1; }
      .bar { fill: #111827; }
      .tab { fill: #eef4ff; stroke: #c7dcff; stroke-width: 1; }
      .green { fill: #e9f8ef; stroke: #a8ddb9; stroke-width: 1; }
      .yellow { fill: #fff7df; stroke: #f1d48a; stroke-width: 1; }
      .red { fill: #fff0ee; stroke: #f0aaa1; stroke-width: 1; }
      .text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .white { fill: #ffffff; }
      .muted { fill: #667085; }
      .blueText { fill: #2563eb; }
      .greenText { fill: #16a34a; }
      .yellowText { fill: #d97706; }
      .redText { fill: #dc2626; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; }
      .normal { font-size: 17px; }
      .title { font-size: 28px; font-weight: 700; }
      .section { font-size: 18px; font-weight: 700; }
      .bold { font-weight: 700; }
      .mono { font-family: Consolas, Menlo, monospace; }
      .line { stroke: #c4ccda; stroke-width: 1.2; fill: none; }
      .shadow { filter: drop-shadow(0 16px 28px rgba(15, 23, 42, 0.12)); }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1040"/>
  <rect class="bar" x="0" y="0" width="1600" height="76"/>
  <text class="white title" x="34" y="48">管理员 Session 控制台</text>
  <text class="white small" x="350" y="47">一个 Session = 一个完整咨询案件，不是一轮对话</text>
  <rect fill="#2563eb" x="1360" y="18" width="170" height="40" rx="20"/>
  <text class="white small bold" x="1390" y="43">Approve Report</text>

  <rect class="panel shadow" x="24" y="100" width="300" height="910" rx="18"/>
  <rect class="panel shadow" x="344" y="100" width="820" height="910" rx="18"/>
  <rect class="panel shadow" x="1184" y="100" width="392" height="910" rx="18"/>

  <!-- Left user/session list -->
  <text class="text section" x="50" y="140">用户与 Session</text>
  <rect class="soft" x="50" y="160" width="248" height="42" rx="12"/>
  <text class="text small muted" x="66" y="186">搜索用户 / 手机 / session</text>

  <rect class="tab" x="50" y="224" width="76" height="30" rx="15"/>
  <text class="text tiny blueText" x="72" y="244">待审</text>
  <rect class="soft" x="136" y="224" width="76" height="30" rx="15"/>
  <text class="text tiny muted" x="158" y="244">进行中</text>
  <rect class="soft" x="222" y="224" width="76" height="30" rx="15"/>
  <text class="text tiny muted" x="244" y="244">已完成</text>

  <rect class="green" x="50" y="278" width="248" height="104" rx="14"/>
  <text class="text small bold" x="68" y="306">用户 A · 目标铺位</text>
  <text class="text tiny muted" x="68" y="332">S-2405-001 · pre_opening</text>
  <text class="text tiny greenText" x="68" y="356">verdict: can_open_candidate</text>

  <rect class="soft" x="50" y="398" width="248" height="104" rx="14"/>
  <text class="text small bold" x="68" y="426">用户 B · 奶茶店</text>
  <text class="text tiny muted" x="68" y="452">S-2405-002 · losing_store</text>
  <text class="text tiny redText" x="68" y="476">verdict: stop_loss_review</text>

  <rect class="soft" x="50" y="518" width="248" height="104" rx="14"/>
  <text class="text small bold" x="68" y="546">用户 C · 加盟咨询</text>
  <text class="text tiny muted" x="68" y="572">S-2405-003 · quack_risk</text>
  <text class="text tiny yellowText" x="68" y="596">waiting evidence</text>

  <text class="text section" x="50" y="676">用户区分</text>
  <rect class="soft" x="50" y="698" width="248" height="176" rx="14"/>
  <text class="text tiny muted" x="68" y="728">owner_user_id</text>
  <text class="text tiny mono" x="68" y="752">u_98a2...</text>
  <text class="text tiny muted" x="68" y="782">store_profile_id</text>
  <text class="text tiny mono" x="68" y="806">store_21f...</text>
  <text class="text tiny muted" x="68" y="836">role</text>
  <text class="text tiny mono blueText" x="68" y="860">admin reviewing end_user session</text>

  <!-- Center session file -->
  <text class="text section" x="374" y="140">Session 档案：S-2405-001</text>
  <rect class="green" x="374" y="160" width="760" height="92" rx="16"/>
  <text class="text normal bold" x="398" y="194">当前结论候选：可以做，但只按轻资产版本开</text>
  <text class="text small muted" x="398" y="222">原因：地址强、账能通、用户有经验；仍需核实学校政策和假期现金流。</text>

  <rect class="soft" x="374" y="274" width="360" height="224" rx="16"/>
  <text class="text section" x="398" y="306">Session 时间线</text>
  <text class="text tiny muted" x="398" y="340">09:12 用户定位到铺位门口</text>
  <text class="text tiny muted" x="398" y="372">09:14 上传门头和对街图片</text>
  <text class="text tiny muted" x="398" y="404">09:17 Agent 收集房租/人工/毛利率</text>
  <text class="text tiny muted" x="398" y="436">09:19 地图查询完成</text>
  <text class="text tiny muted" x="398" y="468">09:22 报告草稿生成</text>

  <rect class="soft" x="754" y="274" width="380" height="224" rx="16"/>
  <text class="text section" x="778" y="306">关键参数</text>
  <text class="text tiny muted" x="778" y="340">房租/月</text>
  <text class="text tiny mono" x="1030" y="340">5000</text>
  <text class="text tiny muted" x="778" y="372">预算</text>
  <text class="text tiny mono" x="1030" y="372">120000 自有</text>
  <text class="text tiny muted" x="778" y="404">目标品类</text>
  <text class="text tiny mono" x="1030" y="404">米饭快餐</text>
  <text class="text tiny muted" x="778" y="436">地址评分</text>
  <text class="text tiny mono greenText" x="1030" y="436">82</text>
  <text class="text tiny muted" x="778" y="468">日盈亏平衡点</text>
  <text class="text tiny mono blueText" x="1030" y="468">1010</text>

  <rect class="soft" x="374" y="522" width="760" height="184" rx="16"/>
  <text class="text section" x="398" y="554">证据与材料</text>
  <rect class="tab" x="398" y="582" width="128" height="34" rx="17"/>
  <text class="text tiny blueText" x="426" y="604">定位坐标</text>
  <rect class="tab" x="542" y="582" width="128" height="34" rx="17"/>
  <text class="text tiny blueText" x="570" y="604">门头照片</text>
  <rect class="tab" x="686" y="582" width="128" height="34" rx="17"/>
  <text class="text tiny blueText" x="714" y="604">POI 查询</text>
  <rect class="tab" x="830" y="582" width="128" height="34" rx="17"/>
  <text class="text tiny blueText" x="850" y="604">相似案例</text>
  <text class="text tiny muted" x="398" y="650">所有证据绑定 Session，管理员可审核但不能静默删除。</text>
  <text class="text tiny muted" x="398" y="680">缺失证据：学校假期安排、排烟/证照、租约付款方式截图。</text>

  <rect class="soft" x="374" y="730" width="760" height="234" rx="16"/>
  <text class="text section" x="398" y="762">Admin 内部备注</text>
  <text class="text tiny muted" x="398" y="794">备注仅内部可见，不进入用户报告。</text>
  <rect fill="#ffffff" stroke="#d0d5dd" x="398" y="812" width="700" height="86" rx="12"/>
  <text class="text tiny muted" x="418" y="846">建议报告审核前补充：学校是否允许校外餐饮、寒暑假现金流、排烟条件。</text>
  <rect fill="#2563eb" x="980" y="914" width="118" height="34" rx="17"/>
  <text class="white tiny bold" x="1008" y="936">保存备注</text>

  <!-- Right admin actions -->
  <text class="text section" x="1214" y="140">管理员 Role 面板</text>
  <rect class="soft" x="1214" y="160" width="332" height="170" rx="16"/>
  <text class="text small bold" x="1238" y="194">可执行动作</text>
  <text class="text tiny muted" x="1238" y="226">请求补证据</text>
  <text class="text tiny muted" x="1238" y="254">发起 slot 修正并写入 audit</text>
  <text class="text tiny muted" x="1238" y="282">审核报告是否可发送</text>
  <text class="text tiny muted" x="1238" y="310">导出用户报告 / 内部 trace</text>

  <rect class="soft" x="1214" y="354" width="332" height="208" rx="16"/>
  <text class="text small bold" x="1238" y="388">隐藏评分</text>
  <text class="text tiny muted" x="1238" y="420">clarity_score</text>
  <text class="text tiny mono greenText" x="1450" y="420">82</text>
  <text class="text tiny muted" x="1238" y="452">execution_score</text>
  <text class="text tiny mono yellowText" x="1450" y="452">55</text>
  <text class="text tiny muted" x="1238" y="484">location_judgment_bias</text>
  <text class="text tiny mono greenText" x="1450" y="484">low</text>
  <text class="text tiny muted" x="1238" y="516">report_readiness</text>
  <text class="text tiny mono blueText" x="1450" y="516">78%</text>

  <rect class="soft" x="1214" y="586" width="332" height="176" rx="16"/>
  <text class="text small bold" x="1238" y="620">报告审核 Checklist</text>
  <text class="text tiny greenText" x="1238" y="652">✓ 有最终结论</text>
  <text class="text tiny greenText" x="1238" y="684">✓ 有财务依据</text>
  <text class="text tiny greenText" x="1238" y="716">✓ 有地址证据</text>
  <text class="text tiny redText" x="1238" y="748">× 缺少学校假期现金流验证</text>

  <rect class="soft" x="1214" y="786" width="332" height="178" rx="16"/>
  <text class="text small bold" x="1238" y="820">权限边界</text>
  <text class="text tiny muted" x="1238" y="852">不能静默篡改用户事实</text>
  <text class="text tiny muted" x="1238" y="884">不能向用户展示隐藏原始分</text>
  <text class="text tiny muted" x="1238" y="916">所有修改必须写 audit log</text>
  <text class="text tiny muted" x="1238" y="948">不能冒充用户发言</text>

  <text class="text tiny muted" x="34" y="1020">文件：docs/session-admin-ui-wireframe.svg · 管理员围绕 Session 档案工作，不围绕单轮对话。</text>
</svg>
