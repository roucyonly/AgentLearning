  <rect fill="#1f2937" x="1280" y="18" width="128" height="38" rx="19"/>
  <text class="white small" x="1304" y="42">model: gpt</text>
  <rect fill="#2563eb" x="1420" y="18" width="138" height="38" rx="19"/>
  <text class="white small bold" x="1447" y="42">Export Trace</text>

