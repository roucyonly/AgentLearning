<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <metadata id="design-map">doc=docs/11-ui-svg-coding-map.md; screen=debug.session.console; route=/debug/sessions/:sessionId; refs=debug.session.console.shell,debug.session.console.sessionList,debug.session.console.traceHeader,debug.session.console.engineDag,debug.session.console.hiddenScores,debug.session.console.toolCalls,debug.session.console.ragHits,debug.session.console.rawEvents,debug.session.console.promptViewer</metadata>
  <defs>
    <style>
      .bg { fill: #eef1f5; }
      .panel { fill: #ffffff; stroke: #cfd7e3; stroke-width: 1.2; }
      .soft { fill: #f8fafc; stroke: #d9e1ec; stroke-width: 1; }
      .darkbar { fill: #111827; }
      .tab { fill: #eef4ff; stroke: #c7dcff; stroke-width: 1; }
      .greenbox { fill: #eaf8f0; stroke: #a9ddb8; stroke-width: 1; }
      .yellowbox { fill: #fff7df; stroke: #efd38c; stroke-width: 1; }
      .redbox { fill: #fff0ee; stroke: #eda79f; stroke-width: 1; }
      .graybox { fill: #f2f4f7; stroke: #d0d5dd; stroke-width: 1; }
      .text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .white { fill: #ffffff; }
      .muted { fill: #667085; }
      .blue { fill: #2563eb; }
      .green { fill: #16a34a; }
      .yellow { fill: #d97706; }
      .red { fill: #dc2626; }
      .purple { fill: #7c3aed; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; }
      .normal { font-size: 17px; }
      .section { font-size: 18px; font-weight: 700; }
      .title { font-size: 28px; font-weight: 700; }
      .bold { font-weight: 700; }
      .line { stroke: #b8c2d2; stroke-width: 1.4; fill: none; }
      .dash { stroke: #b8c2d2; stroke-width: 1.4; fill: none; stroke-dasharray: 6 5; }
      .shadow { filter: drop-shadow(0 16px 28px rgba(15, 23, 42, 0.12)); }
      .mono { font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1040"/>

  <!-- Top header -->
  <rect class="darkbar" x="0" y="0" width="1600" height="74"/>
  <text class="white title" x="34" y="46">Debug UI 控制台</text>
  <text class="white small" x="310" y="45">餐饮创业 Agent · 调用路径 / 隐藏评分 / 工具审计 / RAG / LLM</text>
  <rect fill="#1f2937" x="1130" y="18" width="136" height="38" rx="19"/>
